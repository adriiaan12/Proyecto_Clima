
<!DOCTYPE html>
<html lang="es">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predicción Meteorológica</title>
    
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@100;300;500&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
   
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>

<!-- La clase 'clase_clima' (rain, clear, clouds...) viene de Django y activa el fondo correspondiente -->
<body class="{{ clase_clima|default:'default' }}">

    <!-- === FONDO ANIMADO === -->
    <div class="weather-background">
        <!-- Sol (se muestra solo en 'clear') -->
        <div class="sun"></div>
        
        <!-- Nubes (se muestran en 'clouds' o 'rain') -->
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>
        
        <!-- Lluvia (se muestra solo en 'rain') -->
        <div class="rain-container">
            <div class="rain-layer"></div>
        </div>
        
        <!-- Nieve (se muestra solo en 'snow') -->
        <div class="snow-container">
            <div class="snow-layer"></div>
        </div>

        <!-- Niebla (se muestra solo en 'fog') -->
        <div class="fog-layer"></div>
    </div>

    <!-- === CONTENIDO PRINCIPAL (EFECTO CRISTAL) === -->
    <div class="container glass-panel">
        <h1 class="main-title">Predicción del Tiempo</h1>

        <form method="post" class="weather-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="city">Ubicación</label>
                <div class="select-wrapper">
                    <select name="city" id="city" required>
                        <option value="" disabled selected>Seleccionar ciudad...</option>
                        {% for c in cities %}
                        <!-- Mantiene la selección del usuario si recarga -->
                        <option value="{{ c }}" {% if request.POST.city == c %}selected{% endif %}>{{ c }}</option>
                        {% endfor %}
                    </select>
                    <span class="arrow">▼</span>
                </div>
            </div>
            
            <button type="submit" class="predict-button">Ver Pronóstico</button>
        </form>

        {% if prediccion %}
        <div class="result-box">
            <div class="temp-display">
                <!-- Mostramos la predicción grande -->
                <span class="temp-value">{{ prediccion }}</span>
            </div>
            <div class="weather-desc">Predicción para {{ request.POST.city }}</div>
        </div>
        {% endif %}

        {% if error_aemet %}
        <div class="error-message">
            <p>{{ error_aemet }}</p>
        </div>
        {% endif %}
    </div>

</body>
</html>
